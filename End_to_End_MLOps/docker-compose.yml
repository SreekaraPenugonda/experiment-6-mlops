# Docker Compose for End-to-End MLOps Application
version: "3.8"

services:
  mlops-app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./mlflow.db:/app/mlflow.db
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0